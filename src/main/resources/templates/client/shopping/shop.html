<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instastay 商城</title>
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Bootstrap Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
	rel="stylesheet">
<style>
html, body {
	height: 100% !important;
}

.footer-bgc {
	background-color: rgb(42, 42, 46);
}

.floating-cart {
	position: fixed;
	bottom: 30px;
	right: 30px;
	z-index: 1000;
	font-size: 3rem;
	color: #333;
	text-decoration: none;
}

.floating-cart .badge {
	position: absolute;
	top: 0;
	right: 0;
	transform: translate(50%, -50%);
	font-size: 1rem;
	padding: 0.25em 0.4em;
}
</style>
</head>

<body>
	<!-- 頁首 -->
	<div th:replace="~{/client/common/header}"></div>

	<div class="container my-5">
		<!-- 搜尋表單、分頁和排序 -->
		<div class="mb-4 d-flex align-items-center justify-content-between">
			<!-- 搜尋表單 -->
			<form method="get" th:action="@{/shop}"
				class="d-flex align-items-center col-5">
				<!-- 保留其他參數 -->
				<input type="hidden" name="categoryId" th:value="${categoryId}">
				<input type="hidden" name="orderOption" th:value="${orderOption}">
				<input type="hidden" name="pageNumber" th:value="${page.number + 1}">
				<!-- 搜尋輸入框 -->
				<input type="text" name="searchKeyword" class="form-control me-2"
					placeholder="搜尋商品" th:value="${searchKeyword}">
				<button type="submit" class="btn btn-primary flex-shrink-0">搜尋</button>
			</form>

			<!-- 排序選項和分頁控制 -->
			<div class="d-flex align-items-center">
				<!-- 分頁控制 -->
				<ul th:if="${page.totalPages != 0}" class="pagination mb-0 me-3">
					<!-- 上一頁 -->
					<th:block th:switch="${page.number == 0}">
						<li th:case="${false}" class="page-item"><a class="page-link"
							th:href="@{/shop(pageNumber=${page.number}, searchKeyword=${searchKeyword}, categoryId=${categoryId}, orderOption=${orderOption})}">
								上一頁 </a></li>
						<li th:case="${true}" class="page-item disabled"><a
							class="page-link">上一頁</a></li>
					</th:block>
					<!-- 目前頁數 -->
					<li class="page-item d-flex align-items-center ms-3 me-3"><span
						class=""> 第 <span th:text="${page.number + 1}"></span>
							頁，共 <span th:text="${page.totalPages}"></span> 頁
					</span></li>
					<!-- 下一頁 -->
					<th:block th:switch="${page.number + 1 == page.totalPages}">
						<li th:case="${false}" class="page-item"><a class="page-link"
							th:href="@{/shop(pageNumber=${page.number + 2}, searchKeyword=${searchKeyword}, categoryId=${categoryId}, orderOption=${orderOption})}">
								下一頁 </a></li>
						<li th:case="${true}" class="page-item disabled"><a
							class="page-link">下一頁</a></li>
					</th:block>
				</ul>

				<!-- 排序選項 -->
				<form method="get" th:action="@{/shop}"
					class="d-flex align-items-center">
					<!-- 保留其他參數 -->
					<input type="hidden" name="categoryId" th:value="${categoryId}">
					<input type="hidden" name="pageNumber"
						th:value="${page.number + 1}"> <input type="hidden"
						name="searchKeyword" th:value="${searchKeyword}">
					<!-- 排序選項 -->
					<select name="orderOption" class="form-select"
						onchange="this.form.submit()">
						<option th:value="'productSales_asc'"
							th:selected="${'productSales_asc' == productDTO.attrOrderBy + '_' + (productDTO.selectedSort ? 'desc' : 'asc')}">
							商品銷量由低至高</option>
						<option th:value="'productSales_desc'"
							th:selected="${'productSales_desc' == productDTO.attrOrderBy + '_' + (productDTO.selectedSort ? 'desc' : 'asc')}">
							商品銷量由高至低</option>
						<option th:value="'createdAt_asc'"
							th:selected="${'createdAt_asc' == productDTO.attrOrderBy + '_' + (productDTO.selectedSort ? 'desc' : 'asc')}">
							上架日期由低至高</option>
						<option th:value="'createdAt_desc'"
							th:selected="${'createdAt_desc' == productDTO.attrOrderBy + '_' + (productDTO.selectedSort ? 'desc' : 'asc')}">
							上架日期由高至低</option>
						<option th:value="'productPrice_asc'"
							th:selected="${'productPrice_asc' == productDTO.attrOrderBy + '_' + (productDTO.selectedSort ? 'desc' : 'asc')}">
							商品售價由低至高</option>
						<option th:value="'productPrice_desc'"
							th:selected="${'productPrice_desc' == productDTO.attrOrderBy + '_' + (productDTO.selectedSort ? 'desc' : 'asc')}">
							商品售價由高至低</option>
					</select>
				</form>
			</div>
		</div>

		<!-- 下方主區 -->
		<div class="row">
			<!-- 側邊欄 -->
			<div class="col-12 col-md-3 mb-4">
				<div class="list-group">
					<div class="list-group-item list-group-item-action active">商品分類</div>
					<th:block th:each="productCategoryDTO : ${categoryList}">
						<a th:href="@{/shop(categoryId=${productCategoryDTO.categoryId})}"
							th:text="${productCategoryDTO.categoryName}"
							class="list-group-item list-group-item-action"></a>
					</th:block>
				</div>
			</div>

			<!-- 主內容 -->
			<div class="col-12 col-md-9">
				<!-- 懸浮購物車 -->
				<a th:href="@{/shop/cart}" class="floating-cart"> <i
					class="bi bi-cart3"></i> <span th:if="${cartItemCount > 0}"
					class="badge rounded-pill bg-danger"> <span
						th:text="${cartItemCount}">0</span>
				</span>
				</a>

				<!-- 商品卡片 -->
				<div class="row">
					<th:block th:each="productDTO : ${page.content}">
						<div class="col-12 col-sm-6 col-md-4 col-lg-4 mb-4"
							th:data-current-list-id="${productDTO.productId}">
							<div class="card h-100">
								<a th:href="@{'/shop/detail/' + ${productDTO.productId}}"> <img
									th:src="@{'/management/product/image/' + ${productDTO.productId}}"
									class="card-img-top" alt="商品圖片">
								</a>
								<div class="card-body d-flex flex-column">
									<h5 class="card-title" th:text="${productDTO.productName}"></h5>
									<p class="card-text" th:text="'$' + ${productDTO.productPrice}"></p>
									<div class="mt-auto">
										<button class="btn btn-primary add-to-cart"
											th:data-product-id="${productDTO.productId}"
											th:data-product-price="${productDTO.productPrice}">
											加入購物車</button>
										<button class="btn btn-outline-primary buy-now"
											th:data-product-id="${productDTO.productId}"
											th:data-product-price="${productDTO.productPrice}">
											立即購買</button>
									</div>
								</div>
							</div>
						</div>
					</th:block>
				</div>
			</div>
		</div>
	</div>

	<!-- 頁尾 -->
	<div th:replace="~{/client/common/footer}"></div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<!-- Axios -->
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script>
        // 更新懸浮購物車商品數量
        function updateCartItemCount() {
            axios.get('/booking/shop/api/cart/itemCount')
                .then(res => {
                    if (res.data.success) {
                        const cartItemCount = res.data.data;
                        let badge = document.querySelector('.floating-cart .badge');
                        if (cartItemCount > 0) {
                            if (!badge) {
                                badge = document.createElement('span');
                                badge.className = 'badge rounded-pill bg-danger';
                                document.querySelector('.floating-cart').appendChild(badge);
                            }
                            badge.textContent = cartItemCount;
                        } else if (badge) {
                            badge.remove();
                        }
                    } else {
                        console.error('無法獲取購物車商品數量：' + res.data.message);
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                });
        }

        // 立即購買
        document.querySelectorAll('.buy-now').forEach(buyButton => {
            buyButton.addEventListener("click", function () {
                const url = '/booking/shop/api/buyNow';
                const productId = parseInt(this.getAttribute('data-product-id'));

                axios.post(url, { productId: productId, quantity: 1 })
                    .then(res => {
                        if (res.data.success) {
                            window.location.href = '/booking/shop/checkout/buyNow';
                        } else {
                            alert('購買失敗，請稍後再試：' + res.data.message);
                        }
                    })
                    .catch(err => {
                        console.error('Error', err);
                        alert('發生錯誤，請稍後再試。');
                    });
            });
        });

        // 加入購物車
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function () {
                const productId = parseInt(this.getAttribute('data-product-id'));
                const addCartDTO = {
                    productId: productId,
                    quantity: 1
                };

                fetch('/booking/shop/api/cart/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(addCartDTO)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('商品已成功加入購物車！');
                            updateCartItemCount();
                        } else {
                            alert('添加購物車失敗：' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('發生錯誤，請稍後再試。');
                    });
            });
        });

        // 頁面加載時更新購物車商品數量
        updateCartItemCount();
    </script>
</body>
</html>
